<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Coordonnées</title>
    <link rel="stylesheet" href="styles3.css">
</head>
<body class="coordonnees3">

    <div class="main-containercoordonnees3">
        
        <div class="content-boxcoordonnees3">

            <!-- Colonne gauche : infos contact -->
            <div class="info-leftcoordonnees3">
                <div class="contact-itemcoordonnees3">
                    <span class="iconcoordonnees">@</span> paloma.zbernardini@gmail.com
                </div>
                <div class="contact-itemcoordonnees3">
                    <span class="iconcoordonnees3">📞</span> 07 83 77 22 67
                </div>
                <div class="contact-itemcoordonnees3">
                    <span class="iconcoordonnees3">✈️</span> Bastia (Corse)
                </div>
            </div>

            <!-- Colonne droite : réseaux sociaux avec PNG -->
            <div class="info-rightcoordonnees3">
                <div class="red-barcoordonnees3"></div>
                <div class="social-gridcoordonnees3">
                    <a href="https://www.snapchat.com" class="social-linkcoordonnees3" target="_blank">
                        <img src="snapchat.webp" alt="Snapchat" class="social-iconcoordonnees3">
                    </a>
                    <a href="https://www.instagram.com" class="social-linkcoordonnees3" target="_blank">
                        <img src="instagram.webp" alt="Instagram" class="social-iconcoordonnees3">
                    </a>
                    <a href="https://www.facebook.com" class="social-linkcoordonnees3" target="_blank">
                        <img src="facebook.webp" alt="Facebook" class="social-iconcoordonnees3">
                    </a>
                    <a href="https://www.tiktok.com" class="social-linkcoordonnees3" target="_blank">
                        <img src="tiktok.webp" alt="TikTok" class="social-iconcoordonnees3">
                    </a>
                    <a href="https://www.whatsapp.com" class="social-linkcoordonnees3" target="_blank">
                        <img src="whatsapp.webp" alt="WhatsApp" class="social-iconcoordonnees3">
                    </a>
                    <a href="https://www.discord.com" class="social-linkcoordonnees3" target="_blank">
                        <img src="discord.webp" alt="Discord" class="social-iconcoordonnees3">
                    </a>
                </div>
            </div>

        </div>

        <!-- Bas de page -->
        <div class="footer-sectioncoordonnees3">
            <div class="back-btn-boxcoordonnees3">
                <div class="back-buttoncoordonnees3">⮐</div>
            </div>
        </div>

    </div>

</body>
</html>
